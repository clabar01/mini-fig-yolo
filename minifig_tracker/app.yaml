# app.yaml: The main configuration file for the Arduino App.

# The user-visible name of the application.
name: minifig_tracker

# Short description shown in App Lab.
description: "Shows the green minifig's camera position as a dot on the LED matrix (data arrives over MQTT)."

# The icon for the application, can be an emoji or a short string.
icon: 🟢

# A list of network ports that the application exposes.
ports: []

# A list of bricks used by this application (none needed: MQTT is plain Python).
bricks: []
